<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <title>Decode pipeline and seek</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fff"/>
  <text x="20" y="26" font-size="12" fill="#666">PULL: the caller asks, the decoder reads only what it needs</text>
  <g stroke="#2f9e5b" stroke-width="1.5" fill="#e8f7ee">
    <rect x="20" y="44" width="150" height="62" rx="8" fill="#eef2ff" stroke="#4f5bd5"/>
    <rect x="200" y="44" width="150" height="62" rx="8"/>
    <rect x="380" y="44" width="150" height="62" rx="8"/>
    <rect x="560" y="44" width="150" height="62" rx="8"/>
    <rect x="740" y="44" width="140" height="62" rx="8" fill="#eef2ff" stroke="#4f5bd5"/>
  </g>
  <g text-anchor="middle">
    <text x="95" y="71" font-weight="600">StreamByteReader</text>
    <text x="95" y="90" font-size="11" fill="#444">file, download, yours</text>
    <text x="275" y="71" font-weight="600">AVIO callbacks</text>
    <text x="275" y="90" font-size="11" fill="#444">read, seek, size</text>
    <text x="455" y="71" font-weight="600">demux</text>
    <text x="455" y="90" font-size="11" fill="#444">mp3 aac mov ogg flac wav</text>
    <text x="635" y="71" font-weight="600">decode + swresample</text>
    <text x="635" y="90" font-size="11" fill="#444">Float32 interleaved</text>
    <text x="810" y="71" font-weight="600">nextChunk / read</text>
    <text x="810" y="90" font-size="11" fill="#444">PCM to your renderer</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M170 75 L200 75"/><path d="M350 75 L380 75"/><path d="M530 75 L560 75"/><path d="M710 75 L740 75"/>
  </g>
  <text x="20" y="152" font-size="12" fill="#666">SEEK: seek(toSeconds:) returns where it landed</text>
  <g stroke="#d98a00" stroke-width="1.5" fill="#fff7e6">
    <rect x="20" y="170" width="190" height="62" rx="8"/>
    <rect x="250" y="170" width="190" height="62" rx="8"/>
    <rect x="480" y="170" width="190" height="62" rx="8"/>
    <rect x="710" y="170" width="170" height="62" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="115" y="196" font-weight="600">demuxer seek</text>
    <text x="115" y="215" font-size="11" fill="#444">64 KiB read budget</text>
    <text x="345" y="196" font-weight="600">budget spent?</text>
    <text x="345" y="215" font-size="11" fill="#444">byte-ratio estimate (VBR MP3)</text>
    <text x="575" y="196" font-weight="600">start a pre-roll early</text>
    <text x="575" y="215" font-size="11" fill="#444">fresh or flushed codec</text>
    <text x="795" y="196" font-weight="600">drop up to target</text>
    <text x="795" y="215" font-size="11" fill="#444">sample-accurate landing</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 201 L250 201"/><path d="M440 201 L480 201"/><path d="M670 201 L710 201"/>
  </g>
  <text x="20" y="270" font-size="12" fill="#444">cancel() ends the stream for good. interrupt() unblocks one call from another thread; the next seek clears it.</text>
  <text x="20" y="292" font-size="12" fill="#444">nextChunk() returning nil is not the end: read endReason (eof, failure, cancelled, interrupted).</text>
</svg>
