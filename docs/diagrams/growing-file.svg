<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <title>Growing-file download and recovery</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>
  <text x="20" y="26" font-size="12" fill="#666">ONE DOWNLOAD, WRITTEN TO DISK; THE DECODER READS THE FILE AS IT GROWS</text>
  <g stroke="#2f9e5b" stroke-width="1.5" fill="#e8f7ee">
    <rect x="20" y="44" width="150" height="56" rx="8"/>
    <rect x="230" y="44" width="170" height="56" rx="8"/>
    <rect x="460" y="44" width="200" height="56" rx="8" fill="#eef2ff" stroke="#4f5bd5"/>
    <rect x="720" y="44" width="160" height="56" rx="8" fill="#eef2ff" stroke="#4f5bd5"/>
  </g>
  <g text-anchor="middle">
    <text x="95" y="68" font-weight="600">HTTP host</text><text x="95" y="86" font-size="11" fill="#444">Range: bytes=base-</text>
    <text x="315" y="68" font-weight="600">URLSession queue</text><text x="315" y="86" font-size="11" fill="#444">writes, advances frontier</text>
    <text x="560" y="68" font-weight="600">Growing file [base, frontier)</text><text x="560" y="86" font-size="11" fill="#444">GrowingFileStore .partial</text>
    <text x="800" y="68" font-weight="600">Decoder thread</text><text x="800" y="86" font-size="11" fill="#444">read waits at the frontier</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M170 72 L230 72"/><path d="M400 72 L460 72"/><path d="M720 72 L660 72"/>
  </g>
  <text x="20" y="140" font-size="12" fill="#666">A READ AT POSITION p (GrowingFileDownload.ReadRule)</text>
  <g stroke="#d98a00" stroke-width="1.5" fill="#fff7e6">
    <rect x="20" y="156" width="200" height="50" rx="8"/>
    <rect x="260" y="156" width="200" height="50" rx="8"/>
    <rect x="500" y="156" width="190" height="50" rx="8"/>
    <rect x="730" y="156" width="150" height="50" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="120" y="177" font-weight="600">base &lt;= p &lt; frontier</text><text x="120" y="195" font-size="11" fill="#444">serve from the file</text>
    <text x="360" y="177" font-weight="600">p at the end</text><text x="360" y="195" font-size="11" fill="#444">return 0 (end of stream)</text>
    <text x="595" y="177" font-weight="600">just ahead (&lt; 3 s)</text><text x="595" y="195" font-size="11" fill="#444">wait for bytes</text>
    <text x="805" y="177" font-weight="600">behind or far ahead</text><text x="805" y="195" font-size="11" fill="#444">restart: new file</text>
  </g>
  <text x="20" y="246" font-size="12" fill="#666">A FAILED TRANSACTION (GrowingFileDownload.Retry: 3 answered attempts, 30 s link window, backoff 0.1 s to 2 s)</text>
  <g stroke="#c0392b" stroke-width="1.5" fill="#fdecea">
    <rect x="20" y="262" width="190" height="62" rx="8"/>
    <rect x="260" y="262" width="190" height="62" rx="8"/>
    <rect x="500" y="262" width="190" height="62" rx="8"/>
    <rect x="730" y="262" width="150" height="62" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="115" y="286" font-weight="600">drop, 6 s silent body,</text><text x="115" y="304" font-weight="600">or new network path</text>
    <text x="355" y="286" font-weight="600">backoff</text><text x="355" y="304" font-size="11" fill="#444">file holds decoder position?</text>
    <text x="595" y="286" font-weight="600">resume from frontier</text><text x="595" y="304" font-size="11" fill="#444">206, same total, same file</text>
    <text x="805" y="286" font-weight="600">else restart</text><text x="805" y="304" font-size="11" fill="#444">new file at the position</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210 293 L260 293"/><path d="M450 293 L500 293"/><path d="M690 293 L730 293"/>
  </g>
  <text x="20" y="360" font-size="12" fill="#444">Retries exhausted: the read throws StreamByteReaderError.transport, after the bytes already downloaded are read.</text>
  <text x="20" y="380" font-size="12" fill="#444">A transaction that completes from byte 0 is renamed to &lt;sha256(url)&gt;.audio and cached; partial files are never reused.</text>
</svg>
