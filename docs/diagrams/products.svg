<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <title>Products and how they depend on each other</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="760" height="360" fill="#fff"/>
  <text x="20" y="28" font-size="12" fill="#666">PRODUCTS (what you link)</text>
  <text x="20" y="238" font-size="12" fill="#666">INTERNAL TARGETS</text>
  <rect x="270" y="40" width="220" height="44" rx="8" fill="#eef2ff" stroke="#4f5bd5" stroke-width="1.5"/>
  <text x="380" y="67" text-anchor="middle" font-weight="600">Your app</text>
  <rect x="20" y="130" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="120" y="154" text-anchor="middle" font-weight="600">PlaybackStreaming</text>
  <text x="120" y="173" text-anchor="middle" font-size="12" fill="#444">URL while it downloads</text>
  <rect x="270" y="130" width="200" height="56" rx="8" fill="#e8f7ee" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="370" y="154" text-anchor="middle" font-weight="600">PlaybackDecode</text>
  <text x="370" y="173" text-anchor="middle" font-size="12" fill="#444">decoder + StreamByteReader</text>
  <rect x="520" y="130" width="100" height="56" rx="8" fill="#fff7e6" stroke="#d98a00" stroke-width="1.5"/>
  <text x="570" y="154" text-anchor="middle" font-weight="600">FFmpeg</text>
  <text x="570" y="173" text-anchor="middle" font-size="12" fill="#444">own C code</text>
  <rect x="640" y="130" width="100" height="56" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="690" y="150" text-anchor="middle" font-weight="600" font-size="12">Streaming-</text>
  <text x="690" y="166" text-anchor="middle" font-weight="600" font-size="12">TestSupport</text>
  <text x="690" y="181" text-anchor="middle" font-size="11" fill="#444">tests only</text>
  <rect x="270" y="250" width="200" height="50" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="370" y="272" text-anchor="middle" font-weight="600">CStreamDecode</text>
  <text x="370" y="290" text-anchor="middle" font-size="12" fill="#444">C shim over libavformat</text>
  <rect x="270" y="316" width="350" height="36" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1.5"/>
  <text x="445" y="339" text-anchor="middle" font-weight="600">CFFmpeg (static libffmpeg.a, LGPL-2.1)</text>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M330 84 L130 130"/>
    <path d="M370 84 L370 130"/>
    <path d="M420 84 L560 130" stroke-dasharray="5 3"/>
    <path d="M440 84 L680 130" stroke-dasharray="5 3"/>
    <path d="M220 158 L270 158"/>
    <path d="M370 186 L370 250"/>
    <path d="M370 300 L370 316"/>
    <path d="M570 186 L570 316"/>
  </g>
</svg>
