verify_cmd=scripts/land-verify
verify_timeout=1800
verify_paths=^(Sources/|Tests/|Package\.swift|Package\.resolved|Frameworks/|scripts/land-verify)

# Toolchain or SDK missing: not the branch's fault, so land aborts and drops nothing.
env_failure_patterns=xcrun: error: (unable to find|invalid active developer path)
env_failure_patterns=no such SDK|unable to find sdk|SDK ".*" cannot be located
env_failure_patterns=swift: command not found|error: unable to invoke subcommand
env_failure_patterns=You have not agreed to the Xcode license
